---
#################################
#################################
## Super Linter GitHub Actions ##
#################################
#################################
name: Code Quality

#
# Documentation:
# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
#

#############################
# Start the job on all push #
#############################
on:
  push:
    # branches-ignore: [master, main]
    # Remove the line above to run when pushing to master
  pull_request:
    branches: [master, main]

###############
# Set the Job #
###############
jobs:
  build:
    # Name the Job
    name: Lint Code
    # Set the agent to run on
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    ############################################
    # Grant status permission for MULTI_STATUS #
    ############################################
    permissions:
      contents: read
      packages: read
      statuses: write

    ##################
    # Load all steps #
    ##################
    steps:
      ##########################
      # Checkout the code base #
      ##########################
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full git history is needed to get a proper
          # list of changed files within `super-linter`
          # We will set fetch-depth: 0 to fetch all history for all branches
          # If you hadn't done this, only a single commit would be fetched.
          fetch-depth: 0

      ########################################
      # Run the pinned PHP_CodeSniffer gate #
      ########################################
      - name: Set up PHP_CodeSniffer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          tools: phpcs:4.0.4
          coverage: none

      - name: Run PHP_CodeSniffer 4.0.4
        run: |
          phpcs --version
          phpcs --standard=.github/linters/phpcs.xml --extensions=php .

      ################################
      # Run Linter against code base #
      ################################
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        # https://github.com/marketplace/actions/super-linter#environment-variables
        env:
          # Change to 'true' to scan all files, 'false' for new or edited files
          VALIDATE_ALL_CODEBASE: false
          # Change to 'master' if your main branch differs
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSS_FILE_NAME: stylelint.config.mjs
          LINTER_RULES_PATH: .github/linters
          MARKDOWN_CONFIG_FILE: .markdownlint.json
          PHP_CONFIG_FILE: php.ini
          YAML_CONFIG_FILE: .yaml-lint.yml
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs
          FILTER_REGEX_EXCLUDE: (Releases.*|Screenshots.*)
          # ACTIONS_RUNNER_DEBUG: true
          # CREATE_LOG_FILE: true
          # LOG_FILE: code-linter.log
          # LOG_LEVEL: WARN
          ACTIONS_STEP_DEBUG: true
          IGNORE_GITIGNORED_FILES: true
          SUPPRESS_POSSUM: true
          VALIDATE_CSS: true
          VALIDATE_GITHUB_ACTIONS: true
          # Repository security scanning is intentionally handled outside this feature-quality workflow.
          VALIDATE_HTML: true
          # VALIDATE_JAVA: true
          VALIDATE_JAVASCRIPT_ES: true
          # VALIDATE_JAVASCRIPT_STANDARD: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_PHP: true
          VALIDATE_PHP_BUILTIN: true
          # PHP_CodeSniffer runs above at an explicit version, so it is omitted from this allow-list.
          # VALIDATE_PHP_PHPSTAN: true
          # VALIDATE_PHP_PSALM: true
          # VALIDATE_SHELL_SHFMT: true
          # VALIDATE_SQL: true
          # VALIDATE_SQLFLUFF: true
          VALIDATE_XML: true
          VALIDATE_YAML: true
